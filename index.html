<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta name="theme-color" content="#7c3aed">

    <title>Đọc Tiểu Thuyết Online</title>

    <style>
        /* =====================================================
           BIẾN GIAO DIỆN
        ===================================================== */

        :root {
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-color: #26364a;
            --muted-color: #7b8794;
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --button-text: #ffffff;
            --border-color: #e5e7eb;
            --control-bg: #f8fafc;
            --shadow: 0 12px 40px rgba(30, 41, 59, 0.08);

            --reader-size: 20px;
            --reader-line-height: 1.9;
        }

        /* DARK MODE */

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #172033;
            --text-color: #e5e7eb;
            --muted-color: #94a3b8;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --border-color: #334155;
            --control-bg: #202b40;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            margin: 0;
            padding: 20px;

            background: var(--bg-color);
            color: var(--text-color);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            transition:
                background 0.3s ease,
                color 0.3s ease;

            overflow-x: hidden;
        }

        button,
        select {
            font: inherit;
        }


        /* =====================================================
           KHUNG CHÍNH
        ===================================================== */

        .container {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;

            background: var(--card-bg);

            padding: 32px;

            border-radius: 24px;

            box-shadow: var(--shadow);

            overflow: hidden;
        }


        /* =====================================================
           THANH TRÊN
        ===================================================== */

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;

            margin-bottom: 28px;
        }


        /* =====================================================
           NÚT
        ===================================================== */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 44px;

            padding: 10px 16px;

            border: 0;
            border-radius: 12px;

            background: var(--primary);
            color: var(--button-text);

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                opacity 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            background: #cbd5e1;
            color: #ffffff;
            cursor: not-allowed;
            opacity: 0.7;
        }

        body.dark-mode .btn:disabled {
            background: #475569;
        }

        .theme-toggle {
            background: var(--primary);
            padding: 12px 18px;
            border-radius: 14px;
        }


        /* =====================================================
           TIÊU ĐỀ TRUYỆN
        ===================================================== */

        .book-title {
            margin: 0;

            text-align: center;

            font-size: clamp(32px, 5vw, 54px);
            line-height: 1.12;
            font-weight: 800;

            letter-spacing: -1px;

            overflow-wrap: anywhere;
        }

        .author {
            margin-top: 12px;
            margin-bottom: 30px;

            text-align: center;

            color: var(--muted-color);

            font-size: 19px;
            font-style: italic;
        }


        /* =====================================================
           THANH ĐIỀU KHIỂN CHƯƠNG
        ===================================================== */

        .controls {
            display: grid;

            grid-template-columns: minmax(105px, 1fr)
                                 minmax(180px, 2fr)
                                 minmax(105px, 1fr);

            gap: 10px;

            width: 100%;

            padding: 10px;

            background: var(--control-bg);

            border: 1px solid var(--border-color);

            border-radius: 18px;
        }

        .controls .btn {
            width: 100%;
            min-width: 0;

            white-space: normal;
        }


        /* =====================================================
           SELECT CHỌN CHƯƠNG
        ===================================================== */

        #chapter-select {
            width: 100%;
            min-width: 0;

            padding: 10px 14px;

            border-radius: 12px;

            border: 1px solid var(--border-color);

            background: var(--card-bg);
            color: var(--text-color);

            font-size: 16px;

            outline: none;

            cursor: pointer;
        }

        #chapter-select:focus {
            border-color: var(--primary);
        }


        /* =====================================================
           NỘI DUNG TRUYỆN
        ===================================================== */

        .content {
            width: 100%;

            margin: 28px 0;

            padding: 30px 4px;

            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: var(--reader-size);

            line-height: var(--reader-line-height);

            color: var(--text-color);

            white-space: pre-line;

            overflow-wrap: anywhere;
            word-break: normal;

            min-height: 400px;
        }


        /* =====================================================
           ĐIỀU HƯỚNG CUỐI TRANG
        ===================================================== */

        .footer-nav {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            width: 100%;
        }

        .footer-nav .btn {
            width: 100%;
        }


        /* =====================================================
           THANH CÀI ĐẶT ĐỌC
        ===================================================== */

        .reading-settings {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }

        .reading-settings button {
            width: 42px;
            height: 42px;

            border: 1px solid var(--border-color);
            border-radius: 50%;

            background: var(--control-bg);
            color: var(--text-color);

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        .reading-settings button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .font-label {
            color: var(--muted-color);
            font-size: 14px;
        }


        /* =====================================================
           MOBILE - IPHONE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 0;
            }

            .container {
                width: 100%;
                min-height: 100vh;

                padding:
                    22px
                    16px
                    40px;

                border-radius: 0;

                box-shadow: none;
            }

            .top-bar {
                justify-content: center;

                margin-bottom: 28px;
            }

            .theme-toggle {
                width: 100%;
                max-width: 320px;

                min-height: 50px;

                font-size: 16px;
            }

            .book-title {
                font-size: clamp(34px, 10vw, 48px);
                line-height: 1.13;

                padding: 0 4px;

                letter-spacing: -0.7px;
            }

            .author {
                font-size: 17px;

                margin-top: 12px;
                margin-bottom: 24px;
            }


            /* -------------------------
               CONTROLS MOBILE
            ------------------------- */

            .controls {
                grid-template-columns: 1fr 1.45fr 1fr;

                gap: 6px;

                padding: 7px;

                border-radius: 16px;
            }

            .controls .btn {
                min-height: 56px;

                padding: 7px 5px;

                font-size: 13px;

                line-height: 1.25;
            }

            #chapter-select {
                min-height: 56px;

                padding:
                    8px 5px;

                font-size: 14px;
            }


            /* -------------------------
               NỘI DUNG MOBILE
            ------------------------- */

            .content {
                margin: 22px 0;

                padding: 24px 2px;

                font-size: 19px;

                line-height: 1.85;

                min-height: 300px;
            }


            /* -------------------------
               NÚT CUỐI TRANG
            ------------------------- */

            .footer-nav {
                grid-template-columns: 1fr 1fr;

                gap: 8px;
            }

            .footer-nav .btn {
                min-height: 48px;

                padding:
                    8px 5px;

                font-size: 13px;
            }


            .reading-settings {
                margin-top: 22px;
            }
        }


        /* =====================================================
           MÀN HÌNH RẤT NHỎ
        ===================================================== */

        @media (max-width: 380px) {

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }

            .book-title {
                font-size: 32px;
            }

            .controls {
                gap: 4px;
                padding: 5px;
            }

            .controls .btn {
                font-size: 12px;
            }

            #chapter-select {
                font-size: 13px;
            }

            .content {
                font-size: 18px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- =====================================================
         THANH TRÊN
    ====================================================== -->

    <div class="top-bar">

        <button
            class="btn theme-toggle"
            onclick="toggleDarkMode()"
            id="theme-button">

            🌙 Chế độ Tối

        </button>

    </div>


    <!-- =====================================================
         THÔNG TIN TRUYỆN
    ====================================================== -->

    <h1
        class="book-title"
        id="book-title">
        ẨN TU VÔ THƯỢNG
    </h1>

    <div
        class="author"
        id="book-author">
        Tác giả: Trần Lộc
    </div>


    <!-- =====================================================
         CHỌN CHƯƠNG
    ====================================================== -->

    <div class="controls">

        <button
            class="btn"
            id="prev-btn"
            onclick="changeChapter(-1)">

            ◀ Trước

        </button>


        <select
            id="chapter-select"
            onchange="selectChapter()">

        </select>


        <button
            class="btn"
            id="next-btn"
            onclick="changeChapter(1)">

            Sau ▶

        </button>

    </div>


    <!-- =====================================================
         NỘI DUNG
    ====================================================== -->

    <div
        class="content"
        id="chapter-content">

        Nội dung đang tải...

    </div>


    <!-- =====================================================
         ĐIỀU CHỈNH CỠ CHỮ
    ====================================================== -->

    <div class="reading-settings">

        <button onclick="changeFontSize(-1)">
            A−
        </button>

        <span class="font-label">
            Cỡ chữ
        </span>

        <button onclick="changeFontSize(1)">
            A+
        </button>

    </div>


    <!-- =====================================================
         ĐIỀU HƯỚNG CUỐI
    ====================================================== -->

    <div class="footer-nav">

        <button
            class="btn"
            id="prev-btn-2"
            onclick="changeChapter(-1)">

            ◀ Chương trước

        </button>

        <button
            class="btn"
            id="next-btn-2"
            onclick="changeChapter(1)">

            Chương sau ▶

        </button>

    </div>

</div>


<script>

    /* =====================================================
       DỮ LIỆU TRUYỆN
    ===================================================== */

    const BOOK_DATA = {

        title: "ẨN TU VÔ THƯỢNG",

        author: "Tác giả: Trần Lộc",

        chapters: [

            {
                id: 1,

                title: "CHƯƠNG 1: RỪNG LẠ VÀ CHIẾC SỌ NGỌC",

                content: `Trần Tiểu Nhiên tỉnh dậy vì một giọt sương rơi trúng mí mắt.

Lạnh buốt. Hắn bật ngồi dậy, đầu óc quay mòng mòng như vừa bị ném vào máy giặt. Ký ức cuối cùng còn sót lại là chiếc giường quen thuộc, cái điện thoại mở dở chương ba trăm mười hai của bộ truyện tu tiên hắn theo đã hai năm, và tiếng mẹ vọng lên từ dưới nhà: "Nhiên ơi, xuống ăn cơm, cả nhà chờ mình con đấy!"

Hắn đã đáp đúng như mọi hôm: "Dạ, năm phút nữa ạ."

Bây giờ thì chẳng còn năm phút nào nữa.

Xung quanh là rừng. Không phải thứ rừng có biển chỉ dẫn và lối lát đá cho khách du lịch, mà là rừng già đúng nghĩa. Thân cây to mười người ôm không xuể, rễ trồi lên khỏi mặt đất như đàn trăn hóa đá, tán lá dày đến mức chỉ lọt xuống vài sợi nắng nhợt nhạt. Sương trắng lững lờ giữa những thân cây. Không tiếng xe, không tiếng người. Chỉ có một âm thanh trầm đục từ rất xa vọng lại, kéo dài, khiến gáy hắn nổi hết da gà.

Hắn đang mặc bộ đồ ngủ in hình vịt vàng, chân xỏ mỗi một chiếc dép lê. Chiếc kia biến đâu mất, không biết.

"Mơ thôi... chắc chắn là mơ."

Hắn véo má. Đau điếng. Véo thêm cái nữa, đau hơn. Hắn moi điện thoại trong túi ra, màn hình đen kịt, bấm nút nguồn đến rát cả ngón tay vẫn không lên. Hắn bật cười, tiếng cười khô khốc, rồi tắt ngấm giữa chừng khi nhận ra mình đang run.

Xuyên không. Hai chữ ấy hiện lên quen thuộc đến mức buồn cười. Hắn đọc cả nghìn chương về chuyện này, lần nào cũng gật gù ghen tị với nhân vật chính. Nhưng đọc và sống là hai chuyện khác hẳn nhau. Trong truyện, kẻ rơi vào chốn lạ luôn có cơ duyên chờ sẵn. Ngoài đời, một gã hai mươi ba tuổi chưa từng tự nấu nổi bát mì mà bị quẳng vào rừng sâu, thì cơ duyên duy nhất đang chờ hắn là bụng của một con thú nào đó.

Hắn cắm đầu chạy. Chạy không hướng, không đích, chỉ cần rời xa tiếng gầm kia. Chiếc dép còn lại văng đi sau vài chục bước, lòng bàn chân giẫm phải đá nhọn, gai cào rách ống quần, phổi cháy như có lửa. Rồi hắn vấp phải một cái rễ, ngã sấp mặt, trán đập vào thứ gì đó cứng và lạnh ngắt.

Hắn nhăn nhó ngẩng lên. Ngay dưới gốc cây, nửa chìm trong lớp rêu ẩm, có một chiếc sọ đang nhìn hắn.

Tiểu Nhiên thét lên, bò lùi ra sau, mất nửa phút mới nhận ra thứ đó không phải xương. Nó nhẵn bóng, đen thẫm như mặt hồ đêm không trăng, trên bề mặt có những đường vân mờ mờ chuyển động rất chậm. Thoạt nhìn giống sọ người nhưng lớn hơn một chút, làm bằng thứ ngọc hắn chưa thấy bao giờ. Hai hốc mắt sâu hun hút, không có đáy.

Lẽ ra hắn nên bỏ chạy. Nhưng ba trăm mười hai chương truyện đã dạy hắn một điều: thứ kỳ lạ nằm chỏng chơ giữa rừng, chín phần mười là bảo vật.

Còn một phần là bẫy. Hắn do dự đúng ba giây, rồi lòng tham thắng nỗi sợ. Hắn nhích tới, chìa tay chạm vào.

Một luồng lạnh chạy ngược lên cánh tay, xuyên thẳng lên đầu. Chiếc sọ khẽ rung, và trước khi hắn kịp hoảng, nó đã nằm gọn trong lòng bàn tay, nặng trĩu, mát rượi, như thể vốn thuộc về hắn từ lâu.

Rồi nó rung lần nữa, dữ dội hơn. Cái mát chuyển thành rét buốt, châm dọc sống lưng như kim. Không ai giải thích, Tiểu Nhiên vẫn hiểu ngay: nó đang báo động.

Hắn ôm chặt chiếc sọ, chui tọt vào hốc rỗng dưới gốc cây, co người lại, nín thở.

Vài hơi thở sau, tiếng sột soạt vang lên. Một con thú bước ra từ màn sương: thân hình như báo nhưng to gần bằng con bò, lông xám tro, hai mắt đỏ như hai cục than, cái đuôi đầy gai quét qua lá khô nghe rợn người. Nó hít hít không khí, dừng lại ngay trước hốc cây, cách hắn chừng ba sải tay.

Tim Tiểu Nhiên đập to đến mức hắn tưởng cả khu rừng nghe được. Mồ hôi chảy vào mắt, xót, nhưng hắn không dám chớp. Chiếc sọ trong tay lạnh đều, và kỳ lạ thay, con thú chỉ hất mõm vài cái, gầm gừ khó chịu như thể chẳng thấy gì, rồi quay đi.

Hắn chưa kịp thở ra thì phía xa vang lên tiếng nổ chát chúa, ánh sáng xanh lóe qua tầng lá.

Hắn bò ra khỏi hốc, nấp sau bụi dương xỉ, hé mắt nhìn. Ở khoảng trống phía dưới, hai người đang giao đấu. Không phải kiểu đánh nhau trong phim võ thuật, mà là thứ hắn từng tưởng tượng hàng trăm lần: phi kiếm phát sáng lượn giữa không trung, chém đứt cả thân cổ thụ ngọt như cắt đậu phụ.

Một người áo xanh, mặt trắng bệch. Người kia áo đen, cười khàn khàn.

"Lý sư huynh, giao túi trữ vật ra, ta để ngươi toàn thây."

"Ngươi... dám giết đồng môn?"

"Thái Nhạc Sơn Mạch này, mười người vào chín người không ra. Ở đây làm gì có đồng môn, chỉ có kẻ sống và kẻ chết."

Tiếng cười chưa dứt thì thanh kiếm đã xuyên qua ngực người áo xanh. Không màu mè, không lời trăn trối dài dòng, nhanh đến mức Tiểu Nhiên không kịp chớp mắt. Xác đổ xuống, máu loang đỏ mặt lá. Kẻ áo đen cúi xuống giật chiếc túi bên hông nạn nhân, rồi đứng thẳng dậy.

Rồi hắn ngước lên, đảo mắt về phía bụi dương xỉ.

Một sức ép vô hình quét qua, như bàn tay lạnh ngắt vuốt dọc người Tiểu Nhiên. Chiếc sọ rung bần bật, cái mát lạnh lan khắp lồng ngực hắn. Hắn cắn chặt răng, cứng đờ như tượng gỗ, chờ chết.

Nhưng cái chết không đến. Luồng sức ép lướt qua bụi cây, qua hắn, như gió qua khe cửa, rồi rút đi. Kẻ áo đen nhíu mày lầm bầm điều gì đó, nhảy lên phi kiếm, biến mất sau tán rừng.

Tiểu Nhiên ngồi thụp xuống, chân tay mềm nhũn, quần ướt sũng, mà không phải vì sương. Hắn nhìn chiếc sọ, môi run run.

Nó đã cứu hắn hai lần.

Hắn đếm đủ một trăm nhịp thở mới dám bò ra. Đến gần xác người áo xanh, dạ dày hắn cuộn lên, phải quay đi nôn khan. Người này vừa nãy còn nói còn cử động, giờ nằm đó, mắt mở trừng nhìn lên tán lá. Trong truyện, cảnh này chỉ tốn ba dòng.

Hắn đứng nhìn một lúc. Có chút áy náy, nhưng hắn cũng biết rất rõ: nếu là hắn nằm đó, chẳng ai đứng nhìn hắn lâu đến thế.

"Xin lỗi anh. Tôi cần mấy thứ này hơn anh."

Kẻ áo đen đã vơ túi trữ vật, nhưng bỏ sót ba viên đá trắng đục trong ống tay áo, một tấm ngọc bài khắc ba chữ "Hoàng Phong Cốc" cùng tên "Lý Mộ", và một cuốn sách da mỏng rơi lẫn trong vạt áo, bìa ghi Trường Xuân Công. Đá trắng ấy hẳn là linh thạch hạ phẩm. Thứ chữ vuông vức trên sách lạ hoắc, vậy mà hắn đọc lên hiểu ngay. Hắn chưa dám thắc mắc, đầu óc chỉ còn một ý: phải sống.

    /* =====================================================
       BIẾN
    ===================================================== */

    let currentChapterIndex = 0;

    let fontSize = 19;


    /* =====================================================
       KHỞI TẠO
    ===================================================== */

    function initBook() {

        document.getElementById("book-title").innerText =
            BOOK_DATA.title;

        document.getElementById("book-author").innerText =
            "Tác giả: " + BOOK_DATA.author;


        const select =
            document.getElementById("chapter-select");


        select.innerHTML = "";


        BOOK_DATA.chapters.forEach(
            (chapter, index) => {

                const option =
                    document.createElement("option");

                option.value = index;

                option.textContent =
                    chapter.title;

                select.appendChild(option);

            }
        );


        /* Khôi phục chương đang đọc */

        const savedChapter =
            localStorage.getItem("currentChapter");


        if (
            savedChapter !== null &&
            !isNaN(savedChapter) &&
            Number(savedChapter) < BOOK_DATA.chapters.length
        ) {

            loadChapter(Number(savedChapter));

        } else {

            loadChapter(0);

        }


        /* Khôi phục dark mode */

        if (
            localStorage.getItem("darkMode") === "true"
        ) {

            document.body.classList.add("dark-mode");

            updateThemeButton();

        }


        /* Khôi phục cỡ chữ */

        const savedFontSize =
            localStorage.getItem("fontSize");


        if (savedFontSize) {

            fontSize =
                Number(savedFontSize);

            applyFontSize();

        }

    }


    /* =====================================================
       TẢI CHƯƠNG
    ===================================================== */

    function loadChapter(index) {

        if (
            index < 0 ||
            index >= BOOK_DATA.chapters.length
        ) {
            return;
        }


        currentChapterIndex = index;


        const chapter =
            BOOK_DATA.chapters[index];


        document.getElementById(
            "chapter-content"
        ).innerText = chapter.content;


        document.getElementById(
            "chapter-select"
        ).value = index;


        const isFirst =
            index === 0;


        const isLast =
            index === BOOK_DATA.chapters.length - 1;


        document.getElementById(
            "prev-btn"
        ).disabled = isFirst;


        document.getElementById(
            "prev-btn-2"
        ).disabled = isFirst;


        document.getElementById(
            "next-btn"
        ).disabled = isLast;


        document.getElementById(
            "next-btn-2"
        ).disabled = isLast;


        /* Lưu chương */

        localStorage.setItem(
            "currentChapter",
            index
        );


        /* Lên đầu trang */

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =====================================================
       CHỌN CHƯƠNG
    ===================================================== */

    function selectChapter() {

        const index =
            Number(
                document.getElementById(
                    "chapter-select"
                ).value
            );


        loadChapter(index);

    }


    /* =====================================================
       CHUYỂN CHƯƠNG
    ===================================================== */

    function changeChapter(direction) {

        const newIndex =
            currentChapterIndex + direction;


        if (
            newIndex >= 0 &&
            newIndex < BOOK_DATA.chapters.length
        ) {

            loadChapter(newIndex);

        }

    }


    /* =====================================================
       DARK MODE
    ===================================================== */

    function toggleDarkMode() {

        document.body.classList.toggle(
            "dark-mode"
        );


        const isDark =
            document.body.classList.contains(
                "dark-mode"
            );


        localStorage.setItem(
            "darkMode",
            isDark
        );


        updateThemeButton();

    }


    function updateThemeButton() {

        const button =
            document.getElementById(
                "theme-button"
            );


        const isDark =
            document.body.classList.contains(
                "dark-mode"
            );


        if (isDark) {

            button.innerText =
                "☀️ Chế độ Sáng";

        } else {

            button.innerText =
                "🌙 Chế độ Tối";

        }

    }


    /* =====================================================
       CỠ CHỮ
    ===================================================== */

    function changeFontSize(amount) {

        fontSize += amount;


        if (fontSize < 16) {
            fontSize = 16;
        }


        if (fontSize > 28) {
            fontSize = 28;
        }


        applyFontSize();


        localStorage.setItem(
            "fontSize",
            fontSize
        );

    }


    function applyFontSize() {

        document.documentElement.style.setProperty(
            "--reader-size",
            fontSize + "px"
        );

    }


    /* =====================================================
       CHẠY WEBSITE
    ===================================================== */

    window.addEventListener(
        "load",
        initBook
    );

</script>
